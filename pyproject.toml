[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "percepxion-mcp-server"
version = "2.1.0"
description = "FastMCP server exposing Percepxion APIs as MCP tools"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.11,<4.0",
  "uvicorn>=0.30,<1.0",
  "requests>=2.32.0,<3.0",
  "python-dotenv>=1.2.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-httpserver>=1.1",
]
aws = [
  "boto3>=1.34",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
